<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101827">
<title>SecurityCheck</title>

<style>
:root {
  --bg: #101827;
  --panel: #1b293b;
  --panel2: #24354a;
  --text: #f4f7fb;
  --muted: #a9b7c8;
  --accent: #55c2a5;
  --border: #34465c;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 22px 16px 40px;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
main { max-width: 620px; margin: auto; }
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 28px;
}
.logo { font-size: 23px; font-weight: 800; letter-spacing: -.7px; }
.logo span { color: var(--accent); }
button, input { font: inherit; }
button {
  cursor: pointer;
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 10px 13px;
  background: var(--panel2);
  color: var(--text);
}
button:active { opacity: .75; }
.language { font-size: 13px; }
h1 { font-size: 29px; margin: 0 0 8px; }
.subtitle { color: var(--muted); line-height: 1.5; margin: 0 0 22px; }
.search {
  width: 100%;
  padding: 16px;
  border-radius: 13px;
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  outline: none;
  font-size: 16px;
}
.search:focus { border-color: var(--accent); }
.section-label {
  color: var(--muted);
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .8px;
  margin: 22px 0 10px;
}
.airport-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.airport-chip {
  font-size: 13px;
  padding: 9px 11px;
  border-radius: 20px;
}
.airport-chip.selected {
  border-color: var(--accent);
  color: var(--accent);
}
.empty { color: var(--muted); font-size: 13px; }
.results { margin-top: 24px; }
.airport-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  margin-bottom: 16px;
}
.airport-heading {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: flex-start;
}
.airport-name { font-size: 20px; font-weight: 750; }
.airport-code {
  color: var(--accent);
  font-weight: 800;
  font-size: 14px;
  margin-top: 5px;
}
.country { color: var(--muted); font-size: 13px; margin-top: 5px; }
.favorite { font-size: 21px; padding: 7px 10px; }
.status {
  color: var(--muted);
  background: var(--panel2);
  border-radius: 10px;
  padding: 12px;
  font-size: 13px;
  line-height: 1.5;
  margin-top: 16px;
}
.category {
  border-top: 1px solid var(--border);
  margin-top: 12px;
}
.category button {
  width: 100%;
  border: 0;
  background: transparent;
  padding: 15px 0;
  text-align: left;
  display: flex;
  justify-content: space-between;
  font-weight: 650;
}
.category-content {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows .25s ease;
}
.category.open .category-content { grid-template-rows: 1fr; }
.category-inner {
  overflow: hidden;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.6;
}
.category-inner p { margin: 0 0 14px; }
.website {
  display: inline-block;
  margin-top: 16px;
  color: var(--accent);
  text-decoration: none;
  font-weight: 650;
}
.website:hover { text-decoration: underline; }
footer {
  text-align: center;
  color: var(--muted);
  font-size: 12px;
  margin-top: 35px;
  line-height: 1.6;
}
.hidden { display: none; }
</style>
</head>

<body>
<main>
<header>
  <div class="logo">Security<span>Check</span></div>
  <button class="language" id="languageButton">EN</button>
</header>

<h1 id="headline">Flughafensicherheit. Einfach erklärt.</h1>
<p class="subtitle" id="subtitle">
  Finde die Sicherheitsbestimmungen deines Flughafens.
</p>

<input
  id="search"
  class="search"
  type="search"
  placeholder="Flughafen oder Kürzel suchen …"
  autocomplete="off"
>

<div id="suggestions">
  <div class="section-label" id="favoritesLabel">Deine Favoriten</div>
  <div class="airport-list" id="favorites"></div>

  <div class="section-label" id="recentLabel">Zuletzt gesucht</div>
  <div class="airport-list" id="recent"></div>

  <div class="section-label" id="allLabel">Flughäfen</div>
  <div class="airport-list" id="airportResults"></div>
</div>

<div class="results" id="selectedAirport"></div>

<footer id="footer">
  SecurityCheck ist ein Informationsprojekt. Bitte prüfe wichtige Angaben
  vor deiner Reise zusätzlich auf der offiziellen Website des Flughafens.
</footer>
</main>

<script>
const translations = {
  de: {
    headline: "Flughafensicherheit. Einfach erklärt.",
    subtitle: "Finde die Sicherheitsbestimmungen deines Flughafens.",
    search: "Flughafen oder Kürzel suchen …",
    favorites: "Deine Favoriten",
    recent: "Zuletzt gesucht",
    all: "Flughäfen",
    noFavorites: "Noch keine Favoriten gespeichert.",
    noRecent: "Deine zuletzt gesuchten Flughäfen erscheinen hier.",
    notFound: "Keine passenden Flughäfen gefunden.",
    verified: "Die Sicherheitsregeln für diesen Flughafen sind noch nicht verifiziert.",
    wait: "Aktuelle Wartezeiten sind derzeit nicht verfügbar.",
    categories: [
      "Flüssigkeiten",
      "Elektronische Geräte",
      "Medikamente & Babynahrung",
      "Verbotene Gegenstände",
      "Weitere Informationen"
    ],
    categoryInfo: [
      "Die geltenden Flüssigkeitsregeln müssen noch anhand einer offiziellen Quelle für diesen Flughafen geprüft werden.",
      "Die Regeln zur Kontrolle elektronischer Geräte müssen noch anhand einer offiziellen Quelle geprüft werden.",
      "Bitte prüfe die geltenden Ausnahmen und Nachweispflichten auf der offiziellen Website des Flughafens.",
      "Die Liste der verbotenen Gegenstände muss noch anhand einer offiziellen Quelle geprüft werden.",
      "Weitere Informationen zu den Sicherheitskontrollen findest du auf der offiziellen Website des Flughafens."
    ],
    website: "Offizielle Flughafen-Website öffnen →",
    waitTitle: "Wartezeiten",
    rulesTitle: "Sicherheitsinformationen",
    favoriteAdd: "Als Favorit speichern",
    favoriteRemove: "Aus Favoriten entfernen",
    footer: "SecurityCheck ist ein Informationsprojekt. Bitte prüfe wichtige Angaben vor deiner Reise zusätzlich auf der offiziellen Website des Flughafens."
  },
  en: {
    headline: "Airport security. Made simple.",
    subtitle: "Find the security information for your airport.",
    search: "Search airport or code …",
    favorites: "Your favourites",
    recent: "Recently searched",
    all: "Airports",
    noFavorites: "No favourites saved yet.",
    noRecent: "Your recently searched airports will appear here.",
    notFound: "No matching airports found.",
    verified: "Security rules for this airport have not yet been verified.",
    wait: "Current waiting times are not available.",
    categories: [
      "Liquids",
      "Electronic devices",
      "Medication & baby food",
      "Prohibited items",
      "Further information"
    ],
    categoryInfo: [
      "The applicable liquid rules still need to be checked against an official source for this airport.",
      "The rules for screening electronic devices still need to be checked against an official source.",
      "Please check applicable exemptions and documentation requirements on the airport's official website.",
      "The list of prohibited items still needs to be checked against an official source.",
      "Further information about security screening is available on the airport's official website."
    ],
    website: "Visit official airport website →",
    waitTitle: "Waiting times",
    rulesTitle: "Security information",
    favoriteAdd: "Save as favourite",
    favoriteRemove: "Remove from favourites",
    footer: "SecurityCheck is an information project. Please also check important details on the airport's official website before travelling."
  }
};

let language = localStorage.getItem("sc-language") || "de";
let airports = [];
let selected = null;

const $ = id => document.getElementById(id);
const t = () => translations[language];

function getStored(key) {
  try { return JSON.parse(localStorage.getItem(key) || "[]"); }
  catch { return []; }
}

function saveStored(key, value) {
  localStorage.setItem(key, JSON.stringify(value));
}

function renderSuggestions() {
  const favorites = getStored("sc-favorites");
  const recent = getStored("sc-recent");

  renderChips("favorites", favorites, t().noFavorites);
  renderChips("recent", recent, t().noRecent);
}

function renderChips(elementId, codes, emptyText) {
  const element = $(elementId);
  element.innerHTML = "";

  const matching = codes
    .map(code => airports.find(a => a.iata === code))
    .filter(Boolean);

  if (!matching.length) {
    element.innerHTML = `<span class="empty">${emptyText}</span>`;
    return;
  }

  matching.forEach(airport => {
    const button = document.createElement("button");
    button.className = "airport-chip";
    button.textContent = `${airport.iata} · ${airport.name}`;
    button.addEventListener("click", () => selectAirport(airport));
    element.appendChild(button);
  });
}

function renderAirportList(query = "") {
  const element = $("airportResults");
  element.innerHTML = "";

  const matches = airports.filter(a =>
    `${a.name} ${a.iata} ${a.country}`.toLowerCase()
      .includes(query.toLowerCase())
  );

  if (!matches.length) {
    element.innerHTML = `<span class="empty">${t().notFound}</span>`;
    return;
  }

  matches.slice(0, 20).forEach(airport => {
    const button = document.createElement("button");
    button.className = "airport-chip";
    button.textContent = `${airport.iata} · ${airport.name}`;
    button.addEventListener("click", () => selectAirport(airport));
    element.appendChild(button);
  });
}

function selectAirport(airport) {
  selected = airport;

  let recent = getStored("sc-recent");
  recent = [airport.iata, ...recent.filter(code => code !== airport.iata)].slice(0, 10);
  saveStored("sc-recent", recent);

  renderSuggestions();
  renderSelectedAirport();
  $("search").value = "";
  renderAirportList();
}

function toggleFavorite(code) {
  let favorites = getStored("sc-favorites");

  if (favorites.includes(code)) {
    favorites = favorites.filter(item => item !== code);
  } else {
    favorites = [code, ...favorites];
  }

  saveStored("sc-favorites", favorites);
  renderSuggestions();
  renderSelectedAirport();
}

function renderSelectedAirport() {
  const element = $("selectedAirport");

  if (!selected) {
    element.innerHTML = "";
    return;
  }

  const favorite = getStored("sc-favorites").includes(selected.iata);
  const favoriteLabel = favorite ? "★" : "☆";

  const safeWebsite = selected.website &&
    /^https:\/\/[^ ]+$/i.test(selected.website)
    ? selected.website
    : null;

  element.innerHTML = `
    <div class="airport-card">
      <div class="airport-heading">
        <div>
          <div class="airport-name"></div>
          <div class="airport-code"></div>
          <div class="country"></div>
        </div>
        <button class="favorite" id="favoriteButton"
          aria-label="${favorite ? t().favoriteRemove : t().favoriteAdd}">
          ${favoriteLabel}
        </button>
      </div>

      <div class="status">${t().verified}</div>

      <div class="section-label">${t().waitTitle}</div>
      <div class="status">${t().wait}</div>

      <div class="section-label">${t().rulesTitle}</div>
      <div id="categories"></div>

      ${safeWebsite
        ? `<a class="website" href="${safeWebsite}" target="_blank" rel="noopener">${t().website}</a>`
        : `<div class="status">${t().website}: not available</div>`
      }
    </div>
  `;

  element.querySelector(".airport-name").textContent = selected.name;
  element.querySelector(".airport-code").textContent = selected.iata;
  element.querySelector(".country").textContent = selected.country || "";

  $("favoriteButton").addEventListener("click", () => toggleFavorite(selected.iata));

  const categories = $("categories");

  t().categories.forEach((name, index) => {
    const item = document.createElement("div");
    item.className = "category";

    const button = document.createElement("button");
    button.innerHTML = `<span></span><span>＋</span>`;
    button.querySelector("span").textContent = name;

    const content = document.createElement("div");
    content.className = "category-content";

    const inner = document.createElement("div");
    inner.className = "category-inner";

    const paragraph = document.createElement("p");
    paragraph.textContent = t().categoryInfo[index];
    inner.appendChild(paragraph);
    content.appendChild(inner);

    button.addEventListener("click", () => {
      item.classList.toggle("open");
      button.lastElementChild.textContent =
        item.classList.contains("open") ? "−" : "＋";
    });

    item.appendChild(button);
    item.appendChild(content);
    categories.appendChild(item);
  });
}

function updateLanguage() {
  $("headline").textContent = t().headline;
  $("subtitle").textContent = t().subtitle;
  $("search").placeholder = t().search;
  $("favoritesLabel").textContent = t().favorites;
  $("recentLabel").textContent = t().recent;
  $("allLabel").textContent = t().all;
  $("footer").textContent = t().footer;
  $("languageButton").textContent = language === "de" ? "EN" : "DE";

  renderSuggestions();
  renderAirportList($("search").value);
  renderSelectedAirport();
}

$("languageButton").addEventListener("click", () => {
  language = language === "de" ? "en" : "de";
  localStorage.setItem("sc-language", language);
  updateLanguage();
});

$("search").addEventListener("input", event => {
  renderAirportList(event.target.value);
});

async function init() {
  try {
    const response = await fetch("./airports.json");
    if (!response.ok) throw new Error("Airport data unavailable");

    const data = await response.json();
    airports = Array.isArray(data) ? data : data.airports;

    if (!Array.isArray(airports)) throw new Error("Invalid airport data");

    renderSuggestions();
    renderAirportList();
    updateLanguage();

    const firstAirport = airports.find(a => a.iata === "FRA");
    if (firstAirport) selectAirport(firstAirport);

  } catch (error) {
    $("airportResults").textContent =
      "Die Flughafendaten konnten nicht geladen werden. Bitte versuche es später erneut.";
  }
}

init();
</script>
</body>
</html>
